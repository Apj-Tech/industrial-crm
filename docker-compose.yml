version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: crm_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: industrial_crm
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password_change_me
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'crm_user', '-pcrm_password_change_me']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://crm_user:crm_password_change_me@mysql:3306/industrial_crm
      JWT_SECRET: change_this_to_a_long_random_secret_in_production
      JWT_EXPIRES_IN: 7d
      PORT: 5000
      FRONTEND_URL: http://localhost
      NODE_ENV: production
    expose:
      - '5000'
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = same-origin requests (e.g. /api/...), which nginx below
        # proxies to the backend container. This MUST be empty specifically
        # at build time — Next.js inlines NEXT_PUBLIC_* vars into the
        # client bundle, so it can't be changed at container start.
        NEXT_PUBLIC_API_URL: ''
    container_name: crm_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - '3000'

  nginx:
    image: nginx:alpine
    container_name: crm_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot-www:/var/www/certbot:ro
      - ./nginx/certbot-certs:/etc/letsencrypt:ro

volumes:
  mysql_data:
