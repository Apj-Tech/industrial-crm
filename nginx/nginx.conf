# Industrial CRM — nginx reverse proxy
#
# Routes:
#   /api/*  → backend  (Express, port 5000 inside the Docker network)
#   /*      → frontend (Next.js, port 3000 inside the Docker network)
#
# This file starts in plain HTTP. After you've pointed your domain's DNS
# at this server and run certbot (see README "Hosting" section), uncomment
# the HTTPS server block at the bottom and the redirect line in the HTTP
# block, then `docker compose restart nginx`.

server {
    listen 80;
    server_name _;   # replace with your domain, e.g. crm.yourcompany.com

    # Required for Let's Encrypt's HTTP-01 challenge during certbot setup
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uncomment after SSL is issued, to force HTTPS:
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

